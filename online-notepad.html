<!DOCTYPE html>
<html>
<head>
  <title>Online Notepad</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #222;
      color: white;
      padding: 14px 20px;
    }

    main {
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .toolbar, .compare-box {
      background: white;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    button, input, select {
      padding: 8px 12px;
      margin: 4px;
      cursor: pointer;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      font-family: Consolas, monospace;
      font-size: 15px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: vertical;
      background: white;
      color: #222;
    }

    #editor {
      height: 420px;
    }

    #compareInput, #compareOutput {
      height: 180px;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }

    .dark {
      background: #121212;
      color: #eee;
    }

    .dark .toolbar,
    .dark .compare-box {
      background: #1f1f1f;
      border-color: #444;
    }

    .dark textarea {
      background: #1e1e1e;
      color: #f5f5f5;
      border-color: #555;
    }

    .dark .status {
      color: #ccc;
    }

    a {
      color: inherit;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<header>
  <h2>📝 Online Notepad</h2>
</header>

<main>

  <p><a href="index.html">⬅ Back to Home</a></p>

  <div class="toolbar">
    <input type="file" id="fileInput" accept=".txt,.csv,.json,.xml,.html,.css,.js,.md">

    <button onclick="newFile()">New</button>
    <button onclick="openFile()">Open</button>
    <button onclick="downloadFile()">Download</button>
    <button onclick="copyText()">Copy</button>
    <button onclick="clearText()">Clear</button>
    <button onclick="toggleDarkMode()">Dark Mode</button>

    <br>

    <input type="text" id="findText" placeholder="Find text">
    <input type="text" id="replaceText" placeholder="Replace with">

    <button onclick="findInText()">Find</button>
    <button onclick="findAll()">Find All</button>
    <button onclick="replaceFirst()">Replace First</button>
    <button onclick="replaceAllText()">Replace All</button>

    <label>
      Highlight color:
      <input type="color" id="highlightColor" value="#fff176">
    </label>

    <button onclick="highlightMatches()">Highlight</button>
    <button onclick="removeHighlight()">Remove Highlight</button>

    <br>

    <label>
      File name:
      <input type="text" id="fileName" value="notes.txt">
    </label>

    <label>
      Word wrap:
      <input type="checkbox" id="wordWrap" checked onchange="toggleWordWrap()">
    </label>

    <button onclick="toggleCompare()">Compare</button>
  </div>

  <textarea id="editor" placeholder="Start typing here..." oninput="updateStats()"></textarea>

  <div class="status" id="status">
    Lines: 0 | Words: 0 | Characters: 0
  </div>

  <div id="compareSection" class="compare-box hidden">
    <h3>Compare Text</h3>
    <p>Paste the second text below. The current editor text will be compared against it line by line.</p>

    <textarea id="compareInput" placeholder="Paste second text here"></textarea>

    <br>

    <button onclick="compareText()">Compare Now</button>
    <button onclick="clearCompare()">Clear Compare</button>

    <h3>Compare Result</h3>
    <textarea id="compareOutput" readonly placeholder="Compare result will appear here"></textarea>
  </div>

</main>

<script>
const editor = document.getElementById("editor");
const status = document.getElementById("status");
const fileInput = document.getElementById("fileInput");

let originalTextBeforeHighlight = null;

function newFile() {
  if (editor.value && !confirm("Clear current text and start new?")) {
    return;
  }

  editor.value = "";
  originalTextBeforeHighlight = null;
  document.getElementById("fileName").value = "notes.txt";
  updateStats();
}

function openFile() {
  const file = fileInput.files[0];

  if (!file) {
    alert("Please choose a file first.");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(event) {
    editor.value = event.target.result;
    originalTextBeforeHighlight = null;
    document.getElementById("fileName").value = file.name;
    updateStats();
  };

  reader.readAsText(file);
}

function downloadFile() {
  const text = getCleanEditorText();
  let fileName = document.getElementById("fileName").value.trim();

  if (!fileName) {
    fileName = "notes.txt";
  }

  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download = fileName;
  link.click();

  URL.revokeObjectURL(url);
}

function copyText() {
  const text = getCleanEditorText();

  if (!text) {
    alert("Nothing to copy.");
    return;
  }

  navigator.clipboard.writeText(text)
    .then(() => alert("Copied to clipboard."))
    .catch(() => alert("Copy failed."));
}

function clearText() {
  if (confirm("Clear all text?")) {
    editor.value = "";
    originalTextBeforeHighlight = null;
    updateStats();
  }
}

function toggleDarkMode() {
  document.body.classList.toggle("dark");
}

function toggleWordWrap() {
  const checked = document.getElementById("wordWrap").checked;
  editor.wrap = checked ? "soft" : "off";
  editor.style.whiteSpace = checked ? "pre-wrap" : "pre";
}

function findInText() {
  removeHighlight();

  const query = document.getElementById("findText").value;

  if (!query) {
    alert("Enter text to find.");
    return;
  }

  const start = editor.selectionEnd;
  let index = editor.value.indexOf(query, start);

  if (index === -1) {
    index = editor.value.indexOf(query, 0);
  }

  if (index === -1) {
    alert("Text not found.");
    return;
  }

  editor.focus();
  editor.setSelectionRange(index, index + query.length);
}

function findAll() {
  removeHighlight();

  const query = document.getElementById("findText").value;

  if (!query) {
    alert("Enter text to find.");
    return;
  }

  const text = editor.value;
  const count = countMatches(text, query);

  if (count === 0) {
    alert("No matches found.");
    return;
  }

  status.textContent = `Found ${count} match(es) for "${query}".`;
}

function highlightMatches() {
  const query = document.getElementById("findText").value;
  const color = document.getElementById("highlightColor").value;

  if (!query) {
    alert("Enter text to highlight.");
    return;
  }

  removeHighlight();

  const text = editor.value;
  const count = countMatches(text, query);

  if (count === 0) {
    alert("No matches found.");
    return;
  }

  originalTextBeforeHighlight = text;

  const markerStart = `[[[HIGHLIGHT:${color}]]]`;
  const markerEnd = "[[[/HIGHLIGHT]]]";

  editor.value = text.split(query).join(markerStart + query + markerEnd);

  status.textContent =
    `Highlighted ${count} match(es). Note: textarea cannot show real color, so markers are inserted.`;

  updateStats();
}

function removeHighlight() {
  if (originalTextBeforeHighlight !== null) {
    editor.value = originalTextBeforeHighlight;
    originalTextBeforeHighlight = null;
    updateStats();
    return;
  }

  editor.value = editor.value
    .replace(/\[\[\[HIGHLIGHT:#[0-9a-fA-F]{6}\]\]\]/g, "")
    .replace(/\[\[\[\/HIGHLIGHT\]\]\]/g, "");

  updateStats();
}

function replaceFirst() {
  removeHighlight();

  const find = document.getElementById("findText").value;
  const replace = document.getElementById("replaceText").value;

  if (!find) {
    alert("Enter text to find.");
    return;
  }

  const index = editor.value.indexOf(find);

  if (index === -1) {
    alert("Text not found.");
    return;
  }

  editor.value =
    editor.value.substring(0, index) +
    replace +
    editor.value.substring(index + find.length);

  updateStats();
}

function replaceAllText() {
  removeHighlight();

  const find = document.getElementById("findText").value;
  const replace = document.getElementById("replaceText").value;

  if (!find) {
    alert("Enter text to find.");
    return;
  }

  editor.value = editor.value.split(find).join(replace);
  updateStats();
}

function countMatches(text, query) {
  if (!query) {
    return 0;
  }

  let count = 0;
  let index = 0;

  while (true) {
    index = text.indexOf(query, index);

    if (index === -1) {
      break;
    }

    count++;
    index += query.length;
  }

  return count;
}

function toggleCompare() {
  document.getElementById("compareSection").classList.toggle("hidden");
}

function compareText() {
  removeHighlight();

  const leftText = editor.value;
  const rightText = document.getElementById("compareInput").value;

  const leftLines = leftText.split(/\r?\n/);
  const rightLines = rightText.split(/\r?\n/);

  const maxLines = Math.max(leftLines.length, rightLines.length);
  const results = [];

  let differentCount = 0;

  for (let i = 0; i < maxLines; i++) {
    const left = leftLines[i] ?? "";
    const right = rightLines[i] ?? "";

    if (left === right) {
      results.push(`Line ${i + 1}: SAME`);
    } else {
      differentCount++;
      results.push(`Line ${i + 1}: DIFFERENT`);
      results.push(`  Current : ${left}`);
      results.push(`  Compare : ${right}`);
    }
  }

  document.getElementById("compareOutput").value = results.join("\n");

  status.textContent =
    `Compare complete. ${differentCount} different line(s) found.`;
}

function clearCompare() {
  document.getElementById("compareInput").value = "";
  document.getElementById("compareOutput").value = "";
}

function getCleanEditorText() {
  if (originalTextBeforeHighlight !== null) {
    return originalTextBeforeHighlight;
  }

  return editor.value
    .replace(/\[\[\[HIGHLIGHT:#[0-9a-fA-F]{6}\]\]\]/g, "")
    .replace(/\[\[\[\/HIGHLIGHT\]\]\]/g, "");
}

function updateStats() {
  const text = getCleanEditorText();
  const lines = text ? text.split(/\r?\n/).length : 0;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const chars = text.length;

  status.textContent = `Lines: ${lines} | Words: ${words} | Characters: ${chars}`;
}

updateStats();
</script>

</body>
</html>
